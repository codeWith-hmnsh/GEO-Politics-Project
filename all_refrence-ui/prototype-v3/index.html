<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Geo-Politics Landing Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-bleed satellite globe in a soft sky; glass cards float around it (pulse toggles left, controls right, mode dock bottom-left, markets bottom-right). Calm paper + ink, semantic colours only for data. */
:root{
  color-scheme: light;
  --paper:#F3F1EC; --paper-2:#EAE7DF; --ink:#11232B; --ink-2:#4A5A61; --ink-3:#7D8A8F; --line:rgba(17,35,43,.10);
  --card:rgba(255,255,255,.86); --night:rgba(16,24,30,.88);
  --conflict:#E5484D; --ally:#2FA36B; --neutral:#4C74D9; --mixed:#E8A21C; --summit:#3F63D8; --nuclear:#E8C21C; --gold:#F2B33D; --navy:#14325C;
  --f-display:"Fraunces", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-ui:"Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --shadow:0 16px 44px rgba(17,35,43,.13), 0 2px 6px rgba(17,35,43,.06);
}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sky{position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(48% 62% at 50% 52%, #D7E3EA 0%, rgba(215,227,234,.6) 45%, rgba(243,241,236,0) 75%),
  radial-gradient(35% 40% at 92% 12%, rgba(200,214,222,.7), rgba(243,241,236,0) 70%),
  radial-gradient(30% 35% at 6% 92%, rgba(210,220,226,.7), rgba(243,241,236,0) 70%),
  linear-gradient(180deg,#F6F4EF,#EFEDE7)}
.cloud{position:fixed;pointer-events:none;border-radius:50%;filter:blur(30px);background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,255,255,0));animation:drift 30s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(40px,-14px,0) scale(1.06)}}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.dragging{cursor:grabbing}
#gl.hovering{cursor:pointer}

.top{position:fixed;top:0;left:0;right:0;height:72px;padding:env(safe-area-inset-top,0px) 24px 0;display:flex;align-items:center;gap:36px;z-index:30}
.logo{display:flex;align-items:center;gap:11px;color:var(--ink);cursor:pointer;background:none;border:0;padding:0;text-align:left}
.logo .orb{width:42px;height:42px;border-radius:50%;flex:none;background:#0F1D24;display:grid;place-items:center}
.logo .orb i{width:26px;height:16px;position:relative;display:block}
.logo .orb i::before,.logo .orb i::after{content:"";position:absolute;top:0;width:16px;height:16px;border-radius:50%}
.logo .orb i::before{left:0;background:var(--gold)}
.logo .orb i::after{right:0;border:2.5px solid #fff;box-sizing:border-box}
.logo b{display:block;font:700 22px/1 var(--f-ui);letter-spacing:-.02em}
.logo small{display:block;font-size:12.5px;color:var(--ink-2);margin-top:3px}
.nav{display:flex;gap:30px}
.nav button{background:none;border:0;padding:8px 0;cursor:pointer;color:var(--ink-2);font-weight:500;font-size:14.5px;position:relative}
.nav button[aria-current="true"]{color:var(--ink);font-weight:700}
.nav button[aria-current="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:2px;border-radius:2px;background:var(--ink)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:12px}
.search{position:relative;display:block}
.search input{width:286px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.85);padding:0 14px 0 40px;font:inherit;font-size:13px;color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.search svg{position:absolute;left:13px;top:12px;z-index:1;color:var(--ink-2)}
.chipbox{height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.85);display:flex;align-items:center;gap:10px;padding:0 13px;font-size:13px;line-height:1.2;white-space:nowrap;font-weight:600}
.chipbox small{display:block;color:var(--ink-3);font-weight:500;font-size:11.5px}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.85);display:grid;place-items:center;cursor:pointer;position:relative}
.iconbtn .dot{position:absolute;top:9px;right:10px;width:7px;height:7px;border-radius:50%;background:#F08A24;box-shadow:0 0 0 2px #fff}
.avatar{width:42px;height:42px;border-radius:50%;background:#1F5AA6;color:#fff;font-weight:700;font-size:16px;display:grid;place-items:center;border:0;cursor:pointer}

.pulse{position:fixed;left:22px;top:80px;width:316px;z-index:22;padding:20px;border-radius:18px;background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow);max-height:calc(100% - 190px);overflow:auto;box-sizing:border-box;transition:opacity .35s,transform .45s cubic-bezier(.2,.8,.2,1)}
.pulse .hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pulse h3{font:700 22px/1.15 var(--f-ui);margin:0;letter-spacing:-.02em}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ally);background:rgba(47,163,107,.1);padding:5px 9px;border-radius:999px}
.live i{width:6px;height:6px;border-radius:50%;background:var(--ally);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.3}}
.pulse .q{color:var(--ink-2);font-size:12.5px;margin:6px 0 10px}
.lay{display:grid;grid-template-columns:44px 1fr auto;gap:2px 12px;align-items:center;padding:10px 0}
.lay .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;grid-row:span 2}
.lay .ic svg.i{width:20px;height:20px}
.lay b{font-weight:600;font-size:14px}
.lay small{color:var(--ink-3);font-size:12px;grid-column:2}
.sw{grid-row:span 2;grid-column:3;width:38px;height:22px;border-radius:999px;border:0;background:#CBD2D6;position:relative;cursor:pointer;transition:background .2s;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.sw[aria-checked="true"]{background:var(--c)}
.sw[aria-checked="true"]::after{transform:translateX(16px)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink-2);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;transition:.15s}
.chip:hover{color:var(--ink);border-color:rgba(17,35,43,.3)}
.chip[aria-pressed="true"]{color:#fff;background:var(--c,var(--ink));border-color:transparent}
.scale .bar{height:10px;border-radius:999px;margin-top:10px}
.scale .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-top:6px;font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--ink-3);line-height:1.45;margin:10px 0 0}
.relkey{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:8px;font-size:12px;color:var(--ink-2)}
.relkey span{display:flex;align-items:center;gap:7px}
.relkey i{width:12px;height:12px;border-radius:3px}

#markers{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:6}
.mk-layer{position:absolute;inset:0;transition:opacity .45s ease}
.mk-layer.off{opacity:0}
.mk-layer.off .mk{pointer-events:none!important}
.mk{position:absolute;left:0;top:0;transform:translate(-9999px,-9999px);will-change:transform,opacity;pointer-events:auto;cursor:pointer;background:none;border:0;padding:0}
.mk.hidden{opacity:0!important;pointer-events:none!important}
.hit{width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%}
.tag{position:absolute;left:20px;top:-12px;white-space:nowrap;font:600 12px/1 var(--f-ui);color:#fff;background:var(--night);padding:7px 10px;border-radius:8px;opacity:0;transform:translateX(-4px);transition:.15s;pointer-events:none}
.mk:hover .tag,.mk:focus-visible .tag{opacity:1;transform:none}
.callout{display:flex;align-items:center;gap:10px;padding:9px 12px 9px 10px;border-radius:10px;background:var(--night);color:#fff;border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 26px rgba(0,0,0,.28);white-space:nowrap;text-align:left}
.callout .fl{display:flex;flex-direction:column;gap:3px}
.callout .fl svg{display:block;border-radius:2px}
.callout b{display:block;font-size:13px;font-weight:700}
.callout small{display:block;font-size:11.5px;color:rgba(255,255,255,.72);margin-top:3px}
.callout small i{color:#FF6B6F;font-style:normal;font-weight:700}
.callout .chev{opacity:.6;margin-left:4px}
.callout:hover{background:rgba(16,24,30,.96)}
.medal{display:flex;flex-direction:column;align-items:center;gap:5px;margin:-24px 0 0 -24px;width:48px}
.medal .m{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2A5A9A,#102C55 70%);border:2px solid rgba(255,255,255,.9);box-shadow:0 6px 16px rgba(10,30,60,.45),0 0 0 4px rgba(255,255,255,.18);display:grid;place-items:center;box-sizing:border-box}
.medal .m svg{width:26px;height:26px}
.medal small{font:700 10px/1 var(--f-ui);letter-spacing:.06em;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.medal[aria-pressed="true"] .m{box-shadow:0 6px 16px rgba(10,30,60,.45),0 0 0 4px var(--gold)}
.pill{display:flex;align-items:center;gap:6px;padding:6px 11px 6px 9px;border-radius:999px;background:rgba(255,255,255,.95);box-shadow:0 4px 14px rgba(0,0,0,.22);font:600 12.5px/1 var(--f-ui);white-space:nowrap;color:var(--ink);margin:-14px 0 0 0}
.pill svg.i{width:14px;height:14px;stroke-width:2.4}
.pill .up{color:var(--ally);font-weight:700}.pill .dn{color:var(--conflict);font-weight:700}
.ship{width:40px;height:16px;margin:-8px 0 0 -20px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45));pointer-events:none!important}
.crisis{width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:var(--mixed);border:2px solid #fff;display:grid;place-items:center;color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.3);box-sizing:border-box}
.crisis svg.i{width:12px;height:12px;stroke-width:2.4}
.nuke{width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:var(--nuclear);border:2px solid #fff;display:grid;place-items:center;color:#2A2405;box-shadow:0 3px 10px rgba(0,0,0,.3);box-sizing:border-box}
.choke{width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:var(--mixed);border:2px solid #fff;display:grid;place-items:center;color:#fff;box-shadow:0 0 0 6px rgba(232,162,28,.25),0 3px 10px rgba(0,0,0,.3);box-sizing:border-box}
.lbl{font:500 13px/1 var(--f-display);letter-spacing:.3em;color:rgba(255,255,255,.96);text-shadow:0 1px 4px rgba(0,0,0,.75);white-space:nowrap;translate:-50% -50%;pointer-events:none!important}
.lbl.sm{font-size:10.5px;letter-spacing:.22em}
.lbl.sea{font-style:italic;letter-spacing:.2em;font-size:14px;color:rgba(225,240,250,.92)}
.lbl.st{font:600 10px/1 var(--f-ui);letter-spacing:.04em;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9)}
.lbl.city{font:600 11px/1 var(--f-ui);letter-spacing:0;translate:8px -50%}
.lbl.city::before{content:"";position:absolute;left:-8px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:#FFD27A;box-shadow:0 0 6px #FFB020}

#anchor{position:fixed;left:0;top:0;z-index:12;min-width:216px;max-width:260px;background:var(--night);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:12px;padding:14px 16px;box-shadow:0 14px 40px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s}
#anchor.on{opacity:1}
#anchor .h{display:flex;align-items:center;gap:10px;font:700 17px/1.15 var(--f-ui);margin-bottom:10px}
#anchor dl{display:grid;grid-template-columns:1fr auto;gap:7px 18px;margin:0;font-size:13px}
#anchor dt{color:rgba(255,255,255,.75)} #anchor dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
#anchor::before{content:"";position:absolute;left:-46px;top:26px;width:46px;border-top:1.5px dashed rgba(255,255,255,.85)}

.ctrls{position:fixed;right:30px;top:50%;transform:translateY(-58%);z-index:20;display:flex;flex-direction:column;align-items:center;gap:12px;transition:right .45s cubic-bezier(.2,.8,.2,1)}
.cbtn{width:44px;height:44px;border-radius:50%;background:#fff;border:0;box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.cbtn.sq{border-radius:12px}
.cbtn:hover{background:var(--paper)}
.cgroup{display:flex;flex-direction:column;border-radius:12px;background:#fff;box-shadow:var(--shadow);overflow:hidden}
.cgroup .cbtn{box-shadow:none;border-radius:0}
.cgroup .cbtn+.cbtn{border-top:1px solid var(--line)}
body.panel-open .ctrls{right:440px}

.dock{position:fixed;left:22px;bottom:22px;z-index:22;display:flex;gap:4px;padding:8px;border-radius:16px;background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow);max-width:calc(100% - 44px);overflow-x:auto;scrollbar-width:none;box-sizing:border-box}
.dock::-webkit-scrollbar{display:none}
.dock button{display:flex;align-items:center;gap:10px;height:48px;padding:0 20px;border-radius:12px;border:0;background:none;cursor:pointer;font-weight:500;font-size:14.5px;white-space:nowrap;color:var(--ink);transition:background .2s,color .2s}
.dock button:hover{background:rgba(17,35,43,.06)}
.dock button[aria-pressed="true"]{background:#0F1D24;color:#fff}

.mkt{position:fixed;right:22px;bottom:22px;z-index:20;width:380px;padding:18px 20px;border-radius:16px;background:var(--card);backdrop-filter:blur(18px);box-shadow:var(--shadow);transition:opacity .3s;box-sizing:border-box}
.mkt .t{display:flex;justify-content:space-between;align-items:baseline}
.mkt .t b{font-size:16px;font-weight:700}
.mkt .t button{background:none;border:0;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;padding:0}
.mkt .row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.mkt .ix small{display:block;font-size:12px;color:var(--ink-2);font-weight:600;white-space:nowrap}
.mkt .ix b{display:flex;align-items:center;gap:4px;font-size:13px;margin-top:5px}
.mkt .ix b.up{color:var(--ally)}.mkt .ix b.dn{color:var(--conflict)}
.mkt .ix svg.sp{display:block;margin-top:6px;width:100%;height:26px}
body.panel-open .mkt,body.panel-open .sample{opacity:0;pointer-events:none}

.panel{position:fixed;right:22px;top:80px;width:400px;max-height:calc(100% - 104px);z-index:23;display:flex;flex-direction:column;border-radius:20px;background:rgba(255,255,255,.93);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:var(--shadow);opacity:0;transform:translateX(28px);pointer-events:none;transition:opacity .3s,transform .5s cubic-bezier(.2,1.15,.4,1)}
.panel.open{opacity:1;transform:none;pointer-events:auto}
.panel .scroll{overflow:auto;padding:22px}
.panel .close{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;display:grid;place-items:center;z-index:2}
.stagger>*{animation:rise .45s cubic-bezier(.2,.9,.3,1) both}
.stagger>*:nth-child(2){animation-delay:.05s}.stagger>*:nth-child(3){animation-delay:.1s}.stagger>*:nth-child(4){animation-delay:.15s}.stagger>*:nth-child(n+5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.kicker{font:700 11px/1 var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.ptitle{font:700 26px/1.12 var(--f-ui);letter-spacing:-.025em;margin:0 44px 8px 0;text-wrap:balance}
.psub{color:var(--ink-2);font-size:14px;line-height:1.5}
.status{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:rgba(229,72,77,.1);color:var(--conflict)}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.kpi{padding:14px;border-radius:14px;background:var(--paper);min-width:0}
.kpi .v{font:700 26px/1 var(--f-ui);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .l{font-size:12px;color:var(--ink-2);margin-top:6px;line-height:1.35}
.sect{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.sect h4{margin:0 0 12px;font:700 11px/1 var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.why{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.why li{display:grid;grid-template-columns:24px 1fr;gap:10px;line-height:1.5}
.why li::before{content:attr(data-n);font:700 12px/24px var(--f-ui);text-align:center;background:#0F1D24;color:#fff;border-radius:50%;height:24px}
.parties{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tagx{font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;background:var(--paper);display:inline-flex;align-items:center;gap:6px}
.tagx svg{border-radius:2px}
.news-mini{display:grid;gap:8px}
.news-mini div{padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:#fff;line-height:1.4;font-weight:600}
.news-mini small{display:block;color:var(--ink-3);font-size:12px;margin-top:4px;font-weight:500}
.rel-filter{display:flex;gap:6px;margin:14px 0 8px;flex-wrap:wrap}
.rel{display:grid;grid-template-columns:18px 1fr;gap:3px 10px;padding:10px 8px;border-radius:12px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.rel:hover{background:var(--paper)}
.rel b{font-weight:600}
.rel small{grid-column:2;color:var(--ink-2);font-size:12px;line-height:1.4}
.rdot{width:13px;height:13px;border-radius:50%;margin-top:3px;box-sizing:border-box}
.rdot.ally{background:var(--ally)}
.rdot.hostile{border:2px solid var(--conflict);background:radial-gradient(circle,var(--conflict) 0 3px,transparent 3.5px)}
.rdot.mixed{border:2px solid var(--mixed);background:linear-gradient(90deg,var(--mixed) 50%,transparent 50%)}
.metric{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:13px 0;border-bottom:1px solid var(--line)}
.metric:last-child{border-bottom:0}
.metric .ml{color:var(--ink-2);font-weight:600}
.metric .mv{font:700 20px/1 var(--f-ui);text-align:right;font-variant-numeric:tabular-nums}
.metric .mm{grid-column:1/3;font-size:13px;color:var(--ink-2);line-height:1.45;display:flex;gap:12px;align-items:flex-end;justify-content:space-between}
.metric .src{display:block;font-size:11px;color:var(--ink-3);margin-top:3px}
.est{display:inline-block;font:700 10px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:#8A5E00;background:rgba(242,179,61,.24);border-radius:999px;padding:4px 8px;margin-left:6px;vertical-align:1px}
.cap{display:grid;grid-template-columns:44px 1fr 34px;gap:10px;align-items:center;margin:9px 0}
.cap b{font-weight:600}
.cap .track{height:10px;border-radius:999px;background:var(--paper-2);overflow:hidden}
.cap .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#9DB4F0,#3F63D8);transform-origin:left;animation:grow .9s cubic-bezier(.2,.9,.3,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.cap span{font:700 15px/1 var(--f-ui);text-align:right}
details.how{margin-top:10px;font-size:13px;color:var(--ink-2);line-height:1.5}
details.how summary{cursor:pointer;font-weight:600;color:var(--ink)}
details.how pre{white-space:pre-wrap;font:12px/1.55 ui-monospace,Consolas,monospace;background:var(--paper);padding:12px;border-radius:10px;overflow-x:auto}
.brief{display:grid;gap:8px;margin-top:14px}
.brief button{display:grid;grid-template-columns:30px 1fr;gap:3px 12px;text-align:left;padding:13px;border-radius:14px;background:#fff;border:1px solid var(--line);cursor:pointer;animation:rise .45s both}
.brief button:hover{box-shadow:0 6px 18px rgba(17,35,43,.1)}
.brief .num{font:700 24px/1 var(--f-display);color:#C8891A;grid-row:span 2}
.brief small{color:var(--ink-2);font-size:13px;line-height:1.4}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{height:42px;border-radius:11px;border:1px solid rgba(17,35,43,.16);background:#fff;padding:0 14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--paper)}
.btn.dark{background:#0F1D24;border-color:transparent;color:#fff}
.btn.dark:hover{background:#21323A}
.btn:disabled{opacity:.45;cursor:not-allowed}
.gl-term{padding:12px 0;border-top:1px solid var(--line)}
.gl-term b{font:700 16px/1.2 var(--f-ui)}
.gl-term p{margin:4px 0 0;color:var(--ink-2);line-height:1.5}
.sample{position:fixed;right:22px;top:80px;z-index:19;font:700 11px/1 var(--f-ui);letter-spacing:.05em;color:#7A5300;background:rgba(242,179,61,.22);border:1px solid rgba(232,162,28,.35);padding:7px 11px;border-radius:999px;backdrop-filter:blur(8px)}
.zoomhint{position:fixed;left:50%;bottom:96px;translate:-50% 0;z-index:19;font-size:12px;font-weight:600;color:#fff;background:rgba(16,24,30,.72);padding:7px 12px;border-radius:999px;opacity:0;transition:opacity .4s;pointer-events:none}
.zoomhint.on{opacity:1}

.tour{position:fixed;left:22px;bottom:102px;width:min(440px,calc(100% - 44px));z-index:26;padding:20px;border-radius:18px;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);box-shadow:var(--shadow);display:none;box-sizing:border-box}
body.touring .tour{display:block}
body.touring .pulse,body.touring .panel,body.touring .ctrls,body.touring #anchor,body.touring .mkt,body.touring .mtoggle{opacity:0!important;pointer-events:none!important}
.tour .dots{display:flex;gap:6px;margin-bottom:14px}
.tour .dots i{flex:1;height:4px;border-radius:999px;background:var(--paper-2);transition:.3s}
.tour .dots i.on{background:var(--gold)}
.tour h2{font:700 24px/1.1 var(--f-ui);margin:8px 0;letter-spacing:-.02em}
.tour p{margin:0;line-height:1.55;color:var(--ink-2);font-size:15px;animation:blurIn .8s ease both}
@keyframes blurIn{from{filter:blur(8px);opacity:0}}
.tour .ctrl{display:flex;gap:8px;margin-top:16px;align-items:center;flex-wrap:wrap}
.tour .src{margin-left:auto;font-size:11px;color:var(--ink-3);text-align:right;line-height:1.35}
.tip{position:fixed;z-index:50;pointer-events:none;font:600 12px/1 var(--f-ui);background:var(--night);color:#fff;padding:7px 10px;border-radius:8px;opacity:0;transition:opacity .12s}
.intro{position:fixed;left:50%;top:44%;translate:-50% -50%;z-index:25;text-align:center;pointer-events:none;transition:opacity .9s ease,filter .9s ease;width:min(90vw,900px)}
.intro h1{font:600 clamp(40px,6vw,84px)/1 var(--f-display);letter-spacing:-.03em;color:#fff;margin:0;text-shadow:0 4px 30px rgba(10,30,50,.55)}
.intro h1 em{font-style:italic;font-weight:500}
.intro p{color:rgba(255,255,255,.92);font-size:17px;margin:14px 0 0;text-shadow:0 2px 12px rgba(10,30,50,.6)}
.intro.out{opacity:0;filter:blur(8px)}
.mtoggle{display:none}

@media (max-width:1280px){.nav{display:none}.search input{width:220px}}
@media (max-width:1100px){.mkt{display:none}.chipbox{display:none}}
@media (max-width:760px){
  .top{height:60px;padding:0 14px;gap:10px}
  .logo .orb{width:34px;height:34px}.logo b{font-size:18px}.logo small{display:none}
  .search,.avatar{display:none}
  .pulse{left:12px;right:12px;width:auto;top:64px;max-height:46%;opacity:0;pointer-events:none;transform:translateY(-8px)}
  body.pulse-on .pulse{opacity:1;pointer-events:auto;transform:none}
  .mtoggle{display:inline-flex;position:fixed;left:12px;top:66px;z-index:21}
  body.pulse-on .mtoggle{display:none}
  .ctrls{display:none}
  .dock{left:12px;right:12px;bottom:12px;max-width:none;padding:6px}
  .dock button{height:42px;padding:0 13px;font-size:13.5px}
  .panel{left:0;right:0;bottom:0;top:auto;width:auto;max-height:62%;border-radius:20px 20px 0 0;transform:translateY(40px)}
  .tour{left:12px;bottom:76px}
  #anchor,.zoomhint{display:none}
  .sample{top:auto;bottom:74px}
  .callout{padding:7px 9px}.callout b{font-size:12px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}

const SHIP_SVG=`<svg viewBox="0 0 40 16" width="40" height="16"><path d="M2 9h34l-4 6H7z" fill="#fff"/><path d="M2 9h34l-.8 1.2H2.8z" fill="#C9D6DF"/><rect x="9" y="4" width="5" height="5" fill="#E8EEF2"/><rect x="14.5" y="4" width="5" height="5" fill="#F2B33D"/><rect x="20" y="4" width="5" height="5" fill="#E8EEF2"/><rect x="25.5" y="5" width="5" height="4" fill="#5B8DB8"/><rect x="31" y="2" width="3" height="7" fill="#fff"/><rect x="32" y="1" width="1" height="2" fill="#E5484D"/></svg>`;

const tv=new THREE.Vector3(),tv2=new THREE.Vector3(),cdir=new THREE.Vector3();
function project(v){tv.copy(v).project(camera);return [(tv.x+1)/2*innerWidth,(1-tv.y)/2*innerHeight];}
function facing(v){cdir.copy(camera.position).sub(v).normalize();return tv2.copy(v).normalize().dot(cdir);}
let anchorAt=null;
function updMarkers(dt){
  SHIPS.forEach(s=>{if(!RM)s.t=(s.t+dt*s.sp)%1;const p=s.c.getPointAt(s.t),p2=s.c.getPointAt(Math.min(1,s.t+.002));s.m.v=p;const a=project(p),b=project(p2);s.m.flip=b[0]<a[0];});
  MK.forEach(m=>{const L=$("#mk-"+m.layer);if(L.classList.contains("off"))return;
    if((m.maxD&&cam.dist>m.maxD)||(m.show&&!m.show())){m.el.classList.add("hidden");return;}
    const d=facing(m.v);if(d<.12){m.el.classList.add("hidden");return;}m.el.classList.remove("hidden");
    let [x,y]=project(m.v);if(m.off){x+=m.off[0];y+=m.off[1];}if(y<78){m.el.classList.add("hidden");return;}
    m.el.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px)${m.flip?" scaleX(-1)":""}`;m.el.style.opacity=Math.min(1,(d-.12)*5);});
  if(anchorAt){const d=facing(anchorAt);const [x,y]=project(anchorAt);anchorEl.style.transform=`translate(${(x+52).toFixed(1)}px,${(y-28).toFixed(1)}px)`;anchorEl.classList.toggle("on",d>.2&&!state.tour);}else anchorEl.classList.remove("on");}

function spark(seed,col,w,h){const p=[];let v=.5;for(let i=0;i<10;i++){v=Math.max(.08,Math.min(.92,v+(hsh(seed+i)-.5)*.45));p.push(v);}w=w||88;h=h||28;const d=p.map((y,i)=>`${i?"L":"M"}${(i/9*(w-4)).toFixed(1)},${(h-3-y*(h-8)).toFixed(1)}`).join("");
  return `<svg class="sp" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round"/><circle cx="${(w-4).toFixed(1)}" cy="${(h-3-p[9]*(h-8)).toFixed(1)}" r="3" fill="${col}"/></svg>`;}

    const rows=[];["ally","hostile","mixed"].forEach(s=>Object.entries(R[s]).forEach(([n,b])=>rows.push([n,s,b])));const cnt=s=>rows.filter(r=>r[1]===s).length;
    openPanel(header(name)+`<div class="kpis"><div class="kpi"><div class="v" style="color:var(--ally)" data-count="${cnt("ally")}">0</div><div class="l">allies and partners</div></div><div class="kpi"><div class="v" style="color:var(--conflict)" data-count="${cnt("hostile")}">0</div><div class="l">hostile relations</div></div></div>

    <p class="psub" style="font-size:12px;color:var(--ink-3);margin-top:12px">Every other country shows blue (neutral). Labels are illustrative; real labels show their basis and review date.</p>
    <div class="row-btns"><button class="btn" data-mode-go="economy">${ic("bars")} Economy</button><button class="btn" data-mode-go="defense">${ic("shield")} Defense</button></div>`);
    countUps(pb);$("#relF").onclick=e=>{const b=e.target.closest("[data-f]");if(!b)return;$("#relF").querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));pb.querySelectorAll(".rel").forEach(r=>r.hidden=!(b.dataset.f==="all"||r.dataset.s===b.dataset.f));};
    pb.querySelectorAll(".rel").forEach(r=>r.onclick=()=>{const t=BY[r.dataset.n];if(t)flyTo(t.centroid[0],t.centroid[1]);});pb.querySelectorAll("[data-mode-go]").forEach(b=>b.onclick=()=>setMode(b.dataset.modeGo));setAnchor();return;}
  let h=header(name);
  if(state.mode==="defense"){const cap=["Air","Land","Sea"].map(d=>[d,Math.max(.5,Math.min(9.8,METRICS.defense[2].fn(name)+(hsh(name+d)-.5)*3))]);
    h+=`<div class="sect"><h4>Capability index <span class="est">Estimate</span></h4>${cap.map(c=>`<div class="cap"><b>${c[0]}</b><div class="track"><div class="fill" style="width:${c[1]*10}%"></div></div><span>${c[1].toFixed(1)}</span></div>`).join("")}
    <details class="how"><summary>How we calculate</summary><p>A rough 0–10 estimate of force size from published counts. It is not a prediction of who would win: it ignores training, technology, alliances and geography.</p><pre>n(x) = log(1+x) / log(1+world_max(x))
Air  = 10·(0.55·n(combat aircraft) + 0.20·n(attack helicopters) + 0.25·n(support aircraft))
Land = 10·(0.35·n(ground troops) + 0.35·n(tanks + IFVs) + 0.30·n(artillery))
Sea  = 10·(0.35·n(major surface ships) + 0.35·n(submarines) + 0.30·n(carriers + amphibious))</pre></details></div>`;
    if(NUCLEAR[name])h+=`<div class="sect"><h4>Nuclear status</h4><div class="kpis" style="margin:0"><div class="kpi"><div class="v" data-count="${NUCLEAR[name]}">0</div><div class="l">estimated warheads (FAS 2025)</div></div><div class="kpi"><div class="v" style="font-size:17px">Land · Sea · Air</div><div class="l">delivery legs (curated data)</div></div></div></div>`;}
  h+=`<div class="sect"><h4>Core numbers <span class="est">Illustrative</span></h4>${METRICS[state.mode].filter(m=>m.id!=="nuclear"&&m.id!=="capability").map(m=>{const v=m.fn(name);return `<div class="metric"><span class="ml">${m.label}</span><span class="mv">${fmt(v,m)}</span><div class="mm"><span>${m.mean(v)}<span class="src">Source in build: ${m.src}</span></span>${spark(name+m.id,"#C8891A")}</div></div>`;}).join("")}</div>`;
  if(state.mode==="economy")h+=`<div class="sect"><h4>Top trade partners</h4><p class="psub">The real build draws export arcs (out) and import arcs (in) to the top 5 partners, sized by value, from UN Comtrade.</p></div>`;
  h+=`<div class="sect"><h4>Latest ${state.mode} news</h4>${newsMini([name+": "+state.mode+" headline from a trusted outlet",name+": second headline, different outlet"])}</div>`;
  openPanel(h);countUps(pb);setAnchor();}

$("#mkt").innerHTML=`<div class="t"><b>Markets today</b><button id="mktMore">See more ${ic("arrow")}</button></div><div class="row">${INDICES.map(x=>`<div class="ix"><small>${x[0]}</small><b class="${x[1]>=0?"up":"dn"}">${ic(x[1]>=0?"up":"down")}${x[1]>=0?"+":""}${x[1].toFixed(1)}%</b>${spark(x[0]+(x[1]>=0?"u":"d"),x[1]>=0?"#2FA36B":"#E5484D",70,26)}</div>`).join("")}</div>`;
$("#mktMore").onclick=()=>setMode("economy");

function openBrief(){if(state.mode!=="home")setMode("home");state.selection={kind:"brief"};
  const BR=[["ru-ua","Russia – Ukraine War","Strike and front-line updates; talks on air defence and aid."],["sudan","Sudan Civil War","Aid access and displacement figures."],["summit","ASEAN Summit","Leaders meet on trade and the South China Sea."],["yemen","Red Sea shipping","Why ship insurers and freight costs react."],["gaza","Israel – Gaza Conflict","Humanitarian access and regional diplomacy."]];
  openPanel(`<div class="kicker">Daily brief · example</div><h2 class="ptitle">Five things to know today</h2><div class="psub">Ranked by coverage from trusted outlets across regions. Tap a story to fly there.</div><div class="brief">${BR.map((b,i)=>`<button data-b="${b[0]}" style="animation-delay:${i*60}ms"><span class="num">${i+1}</span><b>${b[1]}</b><small>${b[2]}</small></button>`).join("")}</div>`);
  setNav("brief");pb.querySelectorAll("[data-b]").forEach(x=>x.onclick=()=>x.dataset.b==="summit"?openSummit():openConflict(x.dataset.b));}
function openGlossary(){state.selection={kind:"glossary"};const TG=[["NATO","Military alliance of 32 countries. An attack on one is treated as an attack on all.","NATO"],["BRICS","Group of large emerging economies, from Brazil and India to Iran and Indonesia.","BRICS"],["QUAD","Dialogue between India, the US, Japan and Australia on Indo-Pacific security.","QUAD"],["Inflation","How fast prices rise each year. Central banks usually aim for 2–4%.",null],["Sanctions","Penalties one country puts on another, such as trade bans or frozen assets.",null],["Chokepoint","A narrow sea passage that a large share of world trade must pass through.",null]];
  openPanel(`<div class="kicker">Glossary</div><h2 class="ptitle">Words that explain the world</h2><div class="psub">Tap "See on globe" to highlight members.</div>${TG.map(t=>`<div class="gl-term"><b>${t[0]}</b><p>${t[1]}</p>${t[2]?`<button class="btn" style="margin-top:8px;height:34px" data-see="${t[2]}">${ic("globe")} See on globe</button>`:""}</div>`).join("")}`);
  setNav("glossary");pb.querySelectorAll("[data-see]").forEach(b=>b.onclick=()=>{if(state.mode!=="home")setMode("home");toggleOrg(b.dataset.see);});}
function openSources(){state.selection={kind:"sources"};const S=[["News & events","GDELT, trusted outlet RSS feeds, The Guardian Open Platform, ReliefWeb"],["Economy","IMF DataMapper, World Bank, UN Comtrade"],["Defense","SIPRI (via World Bank), FAS nuclear estimates, curated capability data"],["Energy","Our World in Data, Ember, US EIA, USGS"],["Diplomacy","Wikidata, UN General Assembly votes, curated sanctions list"],["Map","NASA Blue Marble imagery, Natural Earth boundaries, state boundaries from open datasets"]];
  openPanel(`<div class="kicker">Sources</div><h2 class="ptitle">Where every number comes from</h2><div class="psub">Every value in the real build shows its source and an "as of" date. Everything in this prototype is sample data.</div>${S.map(s=>`<div class="gl-term"><b>${s[0]}</b><p>${s[1]}</p></div>`).join("")}`);setNav("sources");}
function goHome(){closePanel();if(state.mode!=="home")setMode("home");flyTo(HOME.lat,HOME.lng,HOME.dist);}
document.querySelector(".nav").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;introOut();const k=b.dataset.nav;
  if(k==="home")goHome();else if(k==="brief")openBrief();else if(k==="stories")startTour();else if(k==="glossary")openGlossary();else if(k==="sources")openSources();});
$("#bell").onclick=openBrief;$("#logo").onclick=goHome;
$("#q").addEventListener("change",e=>{const v=e.target.value.trim().toLowerCase();if(!v)return;const c=COUNTRIES.find(x=>x.name.toLowerCase()===v);const k=CONFLICTS.find(x=>x.name.toLowerCase().includes(v));const o=Object.keys(ORGS).find(x=>x.toLowerCase()===v);
  if(c)selectCountry(c.name);else if(k)openConflict(k.id);else if(o)toggleOrg(o);e.target.value="";e.target.blur();});
$("#cIn").onclick=()=>{T.dist=Math.max(MIN_D,T.dist*.72);lastInput=performance.now();};
$("#cOut").onclick=()=>{T.dist=Math.min(MAX_D,T.dist*1.35);lastInput=performance.now();};
$("#cNorth").onclick=()=>flyTo(T.lat,T.lng,Math.max(T.dist,1.9),700);
$("#cHome").onclick=()=>flyTo(HOME.lat,HOME.lng,HOME.dist);
$("#cLayers").onclick=()=>{const hide=pulse.style.opacity!=="0";pulse.style.opacity=hide?"0":"";pulse.style.pointerEvents=hide?"none":"";};
$("#mToggle").onclick=()=>body.classList.add("pulse-on");

const TOUR={title:"Why the Strait of Hormuz matters",src:"Source: US EIA, World Oil Transit Chokepoints",stops:[
 {lat:26.6,lng:56.3,dist:1.32,title:"A narrow gap",text:"Between Iran and Oman, the Strait of Hormuz is about 33 km wide at its narrowest point.",hl:["Iran","Oman"]},
 {lat:26,lng:50,dist:1.75,title:"Gulf producers",text:"Oil from Saudi Arabia, Iraq, Kuwait, the UAE, Qatar and Iran must pass through it to reach the open sea.",hl:["Saudi Arabia","Iraq","Kuwait","United Arab Emirates","Qatar","Iran"]},
 {lat:22,lng:95,dist:3.0,title:"Most of it goes to Asia",text:"About a fifth of the world's oil use flows through Hormuz, and most of it is shipped to China, India, Japan and South Korea.",hl:["China","India","Japan","Korea"],arcs:true},
 {lat:24,lng:48,dist:1.9,title:"Few ways around",text:"Pipelines across Saudi Arabia to the Red Sea and across the UAE to Fujairah can bypass the strait, but only for part of the flow.",hl:["Saudi Arabia","United Arab Emirates"]},
 {lat:24,lng:68,dist:2.3,title:"Why it matters to you",text:"Any threat to shipping here can push up fuel prices worldwide, including in India. Live: latest verified Hormuz headlines appear here.",hl:["India","Iran","Oman"]}]};
const tourEl=$("#tour");let tT=null;let tourBuilt=false;
function startTour(){introOut();closePanel(true);if(state.mode!=="home")setMode("home");state.tour={step:0,playing:!RM};body.classList.add("touring");setNav("stories");
  if(!tourBuilt){tourBuilt=true;[[31,121],[19,72.8],[35.5,139.7],[35.1,129]].forEach((t,i)=>ARCS.push(new Arc(G.tour,[26.57,56.25],t,{color:0xF2B33D,additive:true,period:3+i*.2,off:i*.4,trail:.4,base:.3,radius:.0026,head:true,headSize:.045})));}
  tourStep(0);}
function tourStep(i){const TS=TOUR.stops,s=TS[i];state.tour.step=i;clearTimeout(tT);state.tourHl=s.hl;state.tourArcs=!!s.arcs;applyLayers();paintOverlay();
  tourEl.innerHTML=`<div class="dots">${TS.map((_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div><div class="kicker">Story · ${TOUR.title}</div><h2>${s.title}</h2><p>${s.text}</p>
  <div class="ctrl"><button class="btn" id="tPrev" ${i?"":"disabled"} aria-label="Previous">${ic("left")}</button><button class="btn" id="tPlay">${state.tour.playing?ic("pause")+" Pause":ic("play")+" Play"}</button><button class="btn dark" id="tNext">${i===TS.length-1?"Finish":"Next"} ${ic("right")}</button><button class="btn" id="tExit" aria-label="Exit story">${ic("x")}</button><span class="src">${TOUR.src}<br>Reviewed: example</span></div>`;
  $("#tPrev").onclick=()=>tourStep(Math.max(0,i-1));$("#tNext").onclick=()=>i===TS.length-1?endTour():tourStep(i+1);$("#tExit").onclick=endTour;$("#tPlay").onclick=()=>{state.tour.playing=!state.tour.playing;tourStep(i);};
  flyTo(s.lat,s.lng,s.dist,2200,()=>{if(state.tour&&state.tour.playing&&state.tour.step===i)tT=setTimeout(()=>{if(state.tour&&state.tour.step===i){if(i===TS.length-1){state.tour.playing=false;tourStep(i);}else tourStep(i+1);}},6500);});}
function endTour(){clearTimeout(tT);state.tour=null;state.tourHl=null;state.tourArcs=false;body.classList.remove("touring");setNav("home");applyLayers();paintOverlay();flyTo(HOME.lat,HOME.lng,HOME.dist);}

addEventListener("keydown",e=>{if(e.target.tagName==="INPUT"){if(e.key==="Escape")e.target.blur();return;}
  if(e.key==="Escape"){if(state.tour)return endTour();if(panel.classList.contains("open"))return closePanel();if(state.mode!=="home")return setMode("home");}
  const k=["1","2","3","4","5"].indexOf(e.key);if(k>=0)setMode(["home","economy","defense","energy","diplomacy"][k]);
  if(e.key==="/"){e.preventDefault();$("#q").focus();}if(e.key==="+"||e.key==="=")$("#cIn").click();if(e.key==="-")$("#cOut").click();
  if(e.key===" "&&state.tour){e.preventDefault();state.tour.playing=!state.tour.playing;tourStep(state.tour.step);}});

let introOn=true;function introOut(){if(!introOn)return;introOn=false;$("#intro").classList.add("out");setTimeout(()=>{const el=$("#intro");if(el)el.remove();},1000);}
setTimeout(introOut,RM?400:3600);

function deep(){const h=location.hash.replace("#","");if(!h)return;introOut();fly=null;
  if(h==="india")selectCountry("India");
  else if(h==="states"){Object.assign(T,{lat:23,lng:79,dist:1.5});Object.assign(cam,T);}
  else if(h==="conflict")openConflict("ru-ua");
  else if(h==="economy"){setMode("economy");selectCountry("India");}
  else if(h==="defense"){state.metric.defense="capability";setMode("defense");selectCountry("India");}
  else if(h==="tour")startTour();else if(h==="nato")toggleOrg("NATO");}

function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener("resize",resize);resize();
paintOverlay();renderPulse();applyLayers();
if(!RM)flyTo(HOME.lat,HOME.lng,HOME.dist,3400);
lastInput=performance.now()-12000;
setTimeout(deep,RM?0:3500);
let last=performance.now(),t0=performance.now();
function loop(now){const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;const t=Math.max(0,(now-t0)/1000);
  if(!stepFly(now)){
    if(!ptrs.size){T.lat=Math.max(-80,Math.min(80,T.lat+vel.lat));T.lng+=vel.lng;const dmp=Math.pow(.9,dt*60);vel.lat*=dmp;vel.lng*=dmp;}
    if(!RM&&!state.tour&&!panel.classList.contains("open")&&now-lastInput>20000&&T.dist>2.2)T.lng-=dt*2.2;
    const k=1-Math.exp(-dt*9);cam.lat+=(T.lat-cam.lat)*k;cam.lng+=(T.lng-cam.lng)*k;cam.dist+=(T.dist-cam.dist)*k;}
  applyCam();
  sunDir.set(-2.6,2.0,3.0).applyQuaternion(camera.quaternion).normalize();
  [cloudsA,cloudsB,cloudShadow].forEach(m=>{m.material.uniforms.uTime.value=RM?0:t;});
  const zf=Math.max(.12,Math.min(1,(cam.dist-1.12)/.7));cloudState.v+=(cloudState.target-cloudState.v)*Math.min(1,dt*3);
  cloudsA.material.uniforms.uOpacity.value=.92*zf*cloudState.v;cloudsB.material.uniforms.uOpacity.value=.32*Math.max(.05,Math.min(1,(cam.dist-1.3)/.8))*cloudState.v;cloudShadow.material.uniforms.uOpacity.value=.22*zf*cloudState.v;
  if(cam.dist<2.05&&!admState)loadAdm();
  admMat.opacity=Math.max(0,Math.min(1,(2.0-cam.dist)/.5))*.55;borderMat.opacity=.42+.38*Math.max(0,Math.min(1,(2.4-cam.dist)/1.0));
  $("#zoomhint").classList.toggle("on",!introOn&&cam.dist<2.3&&cam.dist>1.9&&!panel.classList.contains("open"));
  Object.values(G).forEach(g=>{const u=g.userData;u.fade+=(u.target-u.fade)*Math.min(1,dt/.18);g.visible=u.fade>.01;g.traverse(o=>{const m=o.material;if(!m)return;if(m.uniforms&&m.uniforms.uFade)m.uniforms.uFade.value=u.fade;else if(m.userData.base!==undefined)m.opacity=m.userData.base*u.fade;});});
  ARCS.forEach(a=>a.update(t));relArcs.forEach(a=>a.update(t));
  GLOWS.forEach(g=>{const p=RM?.5:(t*.6+g.ph)%1;g.ring.scale.setScalar(g.base*(.3+1.1*p));g.ring.material.userData.base=.8*(1-p);g.s.scale.setScalar(g.base*(1+.08*Math.sin(t*2+g.ph*6)));});
  renderer.render(scene,camera);updMarkers(dt);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
</script>

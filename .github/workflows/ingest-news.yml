name: Ingest news

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: ingest-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Skip until Supabase is configured
        if: env.SUPABASE_URL == ''
        run: echo "SUPABASE_URL secret not set; nothing to store results in. Skipping." && exit 0
      - uses: actions/checkout@v4
        if: env.SUPABASE_URL != ''
      - uses: actions/setup-node@v4
        if: env.SUPABASE_URL != ''
        with:
          node-version: 24
          cache: npm
      - if: env.SUPABASE_URL != ''
        run: npm ci
      - if: env.SUPABASE_URL != ''
        run: npm run ingest -- news
